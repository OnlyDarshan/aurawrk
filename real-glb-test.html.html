<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1"/>
<title>AURAWRK — Real GLB Garment Test</title>
<style>
:root{--bg:#09090d;--panel:#111118;--line:#282833;--text:#f6f6f8;--muted:#9a9aac;--accent:#8b5cf6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
body{touch-action:none}
.app{height:100%;display:flex;flex-direction:column}
header{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line);background:#0b0b10;flex:0 0 auto}
.brand{font-weight:950;letter-spacing:.16em;font-size:18px}.badge{border:1px solid #4b3b70;background:#181322;color:#dfd4ff;border-radius:999px;padding:8px 12px;font-size:11px;font-weight:850}
.viewer{position:relative;flex:1;min-height:0;background:radial-gradient(circle at 50% 42%,#31313a 0,#1b1b22 31%,#101015 67%,#09090d 100%)}
#stage{position:absolute;inset:0;touch-action:none}
.toolbar{position:absolute;z-index:5;left:50%;top:14px;transform:translateX(-50%);display:flex;gap:7px;background:rgba(11,11,16,.78);padding:7px;border:1px solid #30303b;border-radius:14px;backdrop-filter:blur(10px)}
button{appearance:none;border:1px solid #3a3a48;background:#16161e;color:#f3f3f7;border-radius:9px;padding:9px 11px;font-weight:800;font-size:11px;touch-action:manipulation}button:active{transform:scale(.97)}
.bottom{position:absolute;z-index:5;left:14px;right:14px;bottom:max(14px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:end;gap:10px;pointer-events:none}
.card{pointer-events:auto;background:rgba(14,14,20,.86);border:1px solid #32323e;border-radius:15px;padding:11px 13px;backdrop-filter:blur(12px)}
.status{font-size:11px;color:#c9c9d3;max-width:250px;line-height:1.45}.hint{font-size:11px;color:#bdbdcc;white-space:nowrap}
.loader{position:absolute;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;background:rgba(9,9,13,.35);pointer-events:none}.loaderBox{text-align:center;background:rgba(12,12,17,.9);border:1px solid #33333f;border-radius:16px;padding:18px 20px}.spin{width:30px;height:30px;border-radius:50%;border:3px solid #2b2b35;border-top-color:var(--accent);margin:0 auto 11px;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}.loader strong{font-size:13px;letter-spacing:.08em}.loader small{display:block;margin-top:6px;color:var(--muted);font-size:10px}
.error{color:#ffd8df;border-color:#603244;background:rgba(28,13,18,.92)}
@media(max-width:520px){header{height:58px}.brand{font-size:16px}.badge{font-size:10px;padding:7px 10px}.toolbar{top:10px;width:calc(100% - 20px);justify-content:center}.toolbar button{padding:8px 9px;font-size:10px}.bottom{align-items:stretch;flex-direction:column}.hint{white-space:normal}.card{width:100%}}
</style>
</head>
<body>
<div class="app">
<header><div class="brand">AURAWRK</div><div class="badge">REAL MODEL TEST</div></header>
<section class="viewer">
<div id="stage"></div>
<div class="toolbar">
<button id="front">FRONT</button><button id="left">LEFT</button><button id="right">RIGHT</button><button id="back">BACK</button><button id="reset">RESET</button>
</div>
<div class="loader" id="loader"><div class="loaderBox" id="loaderBox"><div class="spin"></div><strong>LOADING REAL GARMENT</strong><small>3D model + mobile auto-fit</small></div></div>
<div class="bottom"><div class="card status" id="status">Loading a real 3D T-shirt model…</div><div class="card hint">Drag to rotate · pinch to zoom</div></div>
</section>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
(function(){
const stage=document.getElementById('stage'), status=document.getElementById('status'), loader=document.getElementById('loader'), loaderBox=document.getElementById('loaderBox');
function error(msg){status.textContent='MODEL ERROR — '+msg;loaderBox.className='loaderBox error';loaderBox.innerHTML='<strong>MODEL DID NOT LOAD</strong><small style="margin-top:8px">'+msg+'</small>';}
if(!window.THREE || !THREE.GLTFLoader){error('3D libraries did not load.');return;}
try{
 const scene=new THREE.Scene();
 const camera=new THREE.PerspectiveCamera(34,1,.01,1000);
 const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,powerPreference:'high-performance'});
 renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.02;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;stage.appendChild(renderer.domElement);renderer.domElement.style.touchAction='none';
 scene.add(new THREE.HemisphereLight(0xffffff,0x30303a,1.25));
 const key=new THREE.DirectionalLight(0xffffff,3.1);key.position.set(-3.5,5,5);key.castShadow=true;scene.add(key);
 const fill=new THREE.DirectionalLight(0xb9a9ff,1.25);fill.position.set(4,2.2,4);scene.add(fill);
 const rim=new THREE.DirectionalLight(0xffffff,1.7);rim.position.set(0,4,-5);scene.add(rim);
 const root=new THREE.Group();scene.add(root);
 let model=null, radius=1, baseDistance=6, targetDistance=6, distance=6, targetY=0, rotY=0, rotX=-.04, targetRotY=0, targetRotX=-.04;
 function autoCenterAndFit(obj){
   obj.updateMatrixWorld(true);
   const box=new THREE.Box3().setFromObject(obj);const center=box.getCenter(new THREE.Vector3());
   obj.position.sub(center);obj.updateMatrixWorld(true);
   const box2=new THREE.Box3().setFromObject(obj);const sphere=box2.getBoundingSphere(new THREE.Sphere());radius=Math.max(.001,sphere.radius);
   const rect=stage.getBoundingClientRect(); const aspect=Math.max(.2,rect.width/Math.max(1,rect.height));
   const vFov=THREE.MathUtils.degToRad(camera.fov);const hFov=2*Math.atan(Math.tan(vFov/2)*aspect);
   const limiting=Math.min(vFov,hFov);baseDistance=radius/Math.sin(limiting/2)*1.18;
   targetDistance=distance=baseDistance;camera.near=Math.max(.01,baseDistance-radius*3);camera.far=baseDistance+radius*12;camera.updateProjectionMatrix();
   targetY=0;camera.position.set(0,0,distance);camera.lookAt(0,targetY,0);
 }
 function resize(){const r=stage.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/Math.max(1,r.height);camera.updateProjectionMatrix();if(model)autoCenterAndFit(model);}window.addEventListener('resize',resize);resize();
 const gltf=new THREE.GLTFLoader();
 const MODEL='https://raw.githubusercontent.com/AvatarParzival/3d/main/Models/shirt.glb';
 gltf.load(MODEL,function(g){
   model=g.scene;root.add(model);
   model.traverse(function(o){if(o.isMesh){o.castShadow=true;o.receiveShadow=true;if(o.material){o.material.side=THREE.DoubleSide;o.material.roughness=.88;if('metalness' in o.material)o.material.metalness=0;o.material.needsUpdate=true;}}});
   autoCenterAndFit(model);loader.remove();status.textContent='REAL GLB MODEL LOADED — centered and fitted to your screen.';
 },function(p){if(p.total){status.textContent='Loading real garment… '+Math.round(p.loaded/p.total*100)+'%';}},function(e){error((e&&e.message)||'Could not download shirt.glb');});
 const pointers=new Map();let dragging=false,lastX=0,lastY=0,pinchStart=0,pinchDist=0;
 const canvas=renderer.domElement;
 canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture?.(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){dragging=true;lastX=e.clientX;lastY=e.clientY;}else if(pointers.size===2){const a=[...pointers.values()];pinchStart=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);pinchDist=targetDistance;dragging=false;}},{passive:false});
 canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2){const a=[...pointers.values()];const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(pinchStart>0)targetDistance=Math.max(baseDistance*.62,Math.min(baseDistance*1.9,pinchDist*(pinchStart/d)));e.preventDefault();return;}if(dragging){const dx=e.clientX-lastX,dy=e.clientY-lastY;targetRotY+=dx*.0105;targetRotX=Math.max(-.55,Math.min(.45,targetRotX+dy*.006));lastX=e.clientX;lastY=e.clientY;e.preventDefault();}},{passive:false});
 function end(e){pointers.delete(e.pointerId);if(!pointers.size){dragging=false;pinchStart=0;}else if(pointers.size===1){const p=[...pointers.values()][0];lastX=p.x;lastY=p.y;dragging=true;}}canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);
 document.getElementById('front').onclick=()=>{targetRotY=0;targetRotX=-.04};document.getElementById('back').onclick=()=>{targetRotY=Math.PI;targetRotX=-.04};document.getElementById('left').onclick=()=>{targetRotY=-Math.PI/2;targetRotX=-.04};document.getElementById('right').onclick=()=>{targetRotY=Math.PI/2;targetRotX=-.04};document.getElementById('reset').onclick=()=>{targetRotY=0;targetRotX=-.04;targetDistance=baseDistance};
 function loop(){requestAnimationFrame(loop);rotY+=(targetRotY-rotY)*.13;rotX+=(targetRotX-rotX)*.13;distance+=(targetDistance-distance)*.13;root.rotation.y=rotY;root.rotation.x=rotX;camera.position.set(0,0,distance);camera.lookAt(0,targetY,0);renderer.render(scene,camera);}loop();
}catch(e){error(e.message||String(e));}
})();
</script>

</body></html>
