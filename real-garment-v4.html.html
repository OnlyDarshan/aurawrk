<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1"/>
<title>AURAWRK — Real Garment Foundation V4</title>
<style>
:root{--bg:#09090d;--panel:#111118;--line:#292936;--text:#f7f7fa;--muted:#9b9bac;--accent:#8b5cf6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button{font:inherit}
.app{height:100%;display:flex;flex-direction:column;background:#09090d}
header{height:64px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line);background:#0b0b10}
.brand{font-weight:950;letter-spacing:.17em;font-size:18px}.badge{padding:8px 12px;border-radius:999px;border:1px solid #4c3a72;background:#181323;color:#ded4ff;font-size:11px;font-weight:900;letter-spacing:.04em}
.viewer{position:relative;flex:1;min-height:0;overflow:hidden;background:radial-gradient(circle at 50% 45%,#34343d 0,#202027 28%,#141419 56%,#0b0b10 82%,#09090d 100%)}
#stage{position:absolute;inset:0;touch-action:none;overscroll-behavior:none}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
.toolbar{position:absolute;z-index:10;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:6px;border:1px solid #343442;border-radius:14px;background:rgba(12,12,17,.78);backdrop-filter:blur(12px);max-width:calc(100% - 20px)}
.toolbar button{appearance:none;border:1px solid #393947;background:#17171f;color:#f2f2f6;border-radius:9px;padding:9px 11px;font-size:10px;font-weight:900;letter-spacing:.035em;touch-action:manipulation;user-select:none}.toolbar button:active{transform:scale(.97);background:#211a31;border-color:#6b52a8}
.info{position:absolute;z-index:10;left:14px;right:14px;bottom:max(14px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:flex-end;gap:10px;pointer-events:none}.card{pointer-events:auto;border:1px solid #343442;border-radius:15px;background:rgba(14,14,20,.84);backdrop-filter:blur(12px);padding:11px 13px}.status{font-size:11px;line-height:1.45;color:#c9c9d3;max-width:300px}.hint{font-size:11px;color:#bdbdcc;white-space:nowrap}
.loader{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(8,8,12,.22);pointer-events:none}.loaderBox{min-width:220px;text-align:center;padding:18px 20px;border:1px solid #353542;border-radius:16px;background:rgba(12,12,17,.92);backdrop-filter:blur(12px)}.spin{width:30px;height:30px;margin:0 auto 11px;border-radius:50%;border:3px solid #2d2d38;border-top-color:var(--accent);animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}.loader strong{display:block;font-size:12px;letter-spacing:.08em}.loader small{display:block;margin-top:6px;color:var(--muted);font-size:10px;line-height:1.4}.error{border-color:#663345;background:rgba(30,13,19,.95);color:#ffdce2}
.swatches{position:absolute;right:14px;top:78px;z-index:10;display:flex;flex-direction:column;gap:8px;padding:8px;border:1px solid #343442;border-radius:14px;background:rgba(12,12,17,.74);backdrop-filter:blur(10px)}.swatch{width:27px;height:27px;border-radius:8px;border:2px solid rgba(255,255,255,.18);padding:0;touch-action:manipulation}.swatch.active{outline:2px solid #8b5cf6;outline-offset:2px}
@media(max-width:520px){header{height:58px}.brand{font-size:16px}.badge{font-size:10px;padding:7px 10px}.toolbar{top:9px;width:calc(100% - 18px);justify-content:center;gap:5px}.toolbar button{padding:8px 9px;font-size:9px}.swatches{top:66px;right:9px}.swatch{width:25px;height:25px}.info{left:10px;right:10px;flex-direction:column;align-items:stretch}.card{width:100%}.hint{white-space:normal;text-align:center}.status{text-align:left;max-width:none}}
</style>
</head>
<body>
<div class="app">
<header><div class="brand">AURAWRK</div><div class="badge">REAL GARMENT V4</div></header>
<section class="viewer">
  <div id="stage"></div>
  <div class="toolbar">
    <button id="front">FRONT</button><button id="left">LEFT</button><button id="right">RIGHT</button><button id="back">BACK</button><button id="reset">RESET</button>
  </div>
  <div class="swatches" aria-label="Garment colors">
    <button class="swatch active" data-color="#f4f4f1" style="background:#f4f4f1" aria-label="White"></button>
    <button class="swatch" data-color="#151519" style="background:#151519" aria-label="Black"></button>
    <button class="swatch" data-color="#28334f" style="background:#28334f" aria-label="Navy"></button>
    <button class="swatch" data-color="#b9ab91" style="background:#b9ab91" aria-label="Sand"></button>
  </div>
  <div class="loader" id="loader"><div class="loaderBox" id="loaderBox"><div class="spin"></div><strong>LOADING REAL GARMENT</strong><small>Normalizing model + mobile safe fit</small></div></div>
  <div class="info"><div class="card status" id="status">Loading real 3D shirt…</div><div class="card hint">Drag to rotate · pinch to zoom</div></div>
</section>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
(function(){
'use strict';
const stage=document.getElementById('stage');
const status=document.getElementById('status');
const loader=document.getElementById('loader');
const loaderBox=document.getElementById('loaderBox');
const swatches=[...document.querySelectorAll('.swatch')];
function fail(msg){status.textContent='MODEL ERROR — '+msg;loaderBox.classList.add('error');loaderBox.innerHTML='<strong>MODEL DID NOT LOAD</strong><small>'+msg+'</small>';}
if(!window.THREE || !THREE.GLTFLoader){fail('Three.js or GLTFLoader did not load.');return;}
try{
  const scene=new THREE.Scene();
  const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  renderer.outputEncoding=THREE.sRGBEncoding;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.05;
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.domElement.style.touchAction='none';
  stage.appendChild(renderer.domElement);

  // Orthographic camera = predictable fitting on every phone aspect ratio.
  const camera=new THREE.OrthographicCamera(-2,2,2,-2,.01,100);
  camera.position.set(0,0,8);

  // Product-shot lighting.
  scene.add(new THREE.HemisphereLight(0xffffff,0x31313a,1.7));
  const key=new THREE.DirectionalLight(0xffffff,3.2);key.position.set(-4,5,6);key.castShadow=true;scene.add(key);
  const fill=new THREE.DirectionalLight(0xc9b9ff,1.25);fill.position.set(4,1.5,5);scene.add(fill);
  const rim=new THREE.DirectionalLight(0xffffff,1.5);rim.position.set(0,4,-5);scene.add(rim);

  const pivot=new THREE.Group();scene.add(pivot);
  let garment=null;
  let garmentMaterials=[];
  let normalizedRadius=2.1;
  let baseHalfHeight=2.7;
  let zoom=1,targetZoom=1;
  let rotY=0,targetRotY=0,rotX=-0.03,targetRotX=-0.03;

  function setGarmentColor(hex){
    const c=new THREE.Color(hex);
    garmentMaterials.forEach(m=>{m.color.copy(c);m.needsUpdate=true;});
  }

  function prepareGarment(obj){
    // Remove the source model's existing print/texture so this is a clean blank garment test.
    garmentMaterials=[];
    obj.traverse(o=>{
      if(!o.isMesh)return;
      o.castShadow=true;o.receiveShadow=true;
      let source=o.material;
      if(Array.isArray(source)) source=source[0];
      const m=new THREE.MeshStandardMaterial({
        color:0xf4f4f1,
        roughness:.91,
        metalness:0,
        side:THREE.DoubleSide
      });
      // Keep normal/bump maps only if they exist; discard color/logo textures.
      if(source){
        if(source.normalMap)m.normalMap=source.normalMap;
        if(source.bumpMap)m.bumpMap=source.bumpMap;
        if(source.roughnessMap)m.roughnessMap=source.roughnessMap;
        if(source.aoMap)m.aoMap=source.aoMap;
      }
      o.material=m; garmentMaterials.push(m);
    });

    // 1) Measure original model.
    obj.updateMatrixWorld(true);
    const box=new THREE.Box3().setFromObject(obj);
    const size=box.getSize(new THREE.Vector3());
    const center=box.getCenter(new THREE.Vector3());

    // 2) Center geometry exactly at the pivot origin.
    obj.position.set(-center.x,-center.y,-center.z);
    obj.updateMatrixWorld(true);

    // 3) Normalize model height to a known world-space size.
    const targetHeight=4.25;
    const safeHeight=Math.max(size.y,.0001);
    const uniform=targetHeight/safeHeight;
    obj.scale.setScalar(uniform);
    obj.updateMatrixWorld(true);

    // 4) Re-measure normalized model and correct any residual center shift.
    const b2=new THREE.Box3().setFromObject(obj);
    const c2=b2.getCenter(new THREE.Vector3());
    obj.position.x-=c2.x;obj.position.y-=c2.y;obj.position.z-=c2.z;
    obj.updateMatrixWorld(true);

    const b3=new THREE.Box3().setFromObject(obj);
    const s3=b3.getSize(new THREE.Vector3());
    const sphere=b3.getBoundingSphere(new THREE.Sphere());
    normalizedRadius=Math.max(1.9,sphere.radius);
    baseHalfHeight=Math.max(s3.y*.64,normalizedRadius*1.18);
    updateCameraFrustum();
  }

  function updateCameraFrustum(){
    const r=stage.getBoundingClientRect();
    const aspect=Math.max(.25,r.width/Math.max(1,r.height));
    // generous padding so rotations never clip on narrow iPhones.
    const hh=(baseHalfHeight*1.14)/zoom;
    const hw=hh*aspect;
    camera.left=-hw;camera.right=hw;camera.top=hh;camera.bottom=-hh;
    camera.near=.01;camera.far=100;camera.updateProjectionMatrix();
    camera.position.set(0,0,8);camera.lookAt(0,0,0);
  }

  function resize(){
    const r=stage.getBoundingClientRect();
    renderer.setSize(Math.max(1,r.width),Math.max(1,r.height),false);
    updateCameraFrustum();
  }
  window.addEventListener('resize',resize,{passive:true});
  resize();

  const gltfLoader=new THREE.GLTFLoader();
  const MODEL='https://raw.githubusercontent.com/AvatarParzival/3d/main/Models/shirt.glb';
  gltfLoader.load(MODEL,g=>{
    garment=g.scene;
    pivot.add(garment);
    prepareGarment(garment);
    loader.remove();
    status.textContent='REAL GARMENT LOADED — centered, normalized and mobile-fitted.';
  },p=>{
    if(p.total)status.textContent='Loading garment… '+Math.round((p.loaded/p.total)*100)+'%';
  },e=>fail((e&&e.message)||'Could not download shirt.glb'));

  // Pointer controls: drag = orbit garment; pinch = zoom. No OrbitControls dependency.
  const pointers=new Map();
  let dragging=false,lastX=0,lastY=0,pinchStart=0,pinchZoom=1;
  const canvas=renderer.domElement;
  canvas.addEventListener('pointerdown',e=>{
    e.preventDefault();
    canvas.setPointerCapture?.(e.pointerId);
    pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pointers.size===1){dragging=true;lastX=e.clientX;lastY=e.clientY;}
    else if(pointers.size===2){const a=[...pointers.values()];pinchStart=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);pinchZoom=targetZoom;dragging=false;}
  },{passive:false});
  canvas.addEventListener('pointermove',e=>{
    if(!pointers.has(e.pointerId))return;
    e.preventDefault();pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pointers.size===2){const a=[...pointers.values()];const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(pinchStart>5){targetZoom=Math.max(.72,Math.min(1.38,pinchZoom*(d/pinchStart)));}return;}
    if(dragging){const dx=e.clientX-lastX,dy=e.clientY-lastY;targetRotY+=dx*.0105;targetRotX=Math.max(-.48,Math.min(.40,targetRotX+dy*.0055));lastX=e.clientX;lastY=e.clientY;}
  },{passive:false});
  function pointerEnd(e){pointers.delete(e.pointerId);if(pointers.size===0){dragging=false;pinchStart=0;}else if(pointers.size===1){const p=[...pointers.values()][0];lastX=p.x;lastY=p.y;dragging=true;}}
  canvas.addEventListener('pointerup',pointerEnd,{passive:false});canvas.addEventListener('pointercancel',pointerEnd,{passive:false});

  document.getElementById('front').onclick=()=>{targetRotY=0;targetRotX=-.03};
  document.getElementById('back').onclick=()=>{targetRotY=Math.PI;targetRotX=-.03};
  document.getElementById('left').onclick=()=>{targetRotY=-Math.PI/2;targetRotX=-.03};
  document.getElementById('right').onclick=()=>{targetRotY=Math.PI/2;targetRotX=-.03};
  document.getElementById('reset').onclick=()=>{targetRotY=0;targetRotX=-.03;targetZoom=1};
  swatches.forEach(btn=>btn.onclick=()=>{swatches.forEach(b=>b.classList.remove('active'));btn.classList.add('active');setGarmentColor(btn.dataset.color);});

  function animate(){
    requestAnimationFrame(animate);
    rotY+=(targetRotY-rotY)*.14;rotX+=(targetRotX-rotX)*.14;
    const oldZoom=zoom;zoom+=(targetZoom-zoom)*.14;if(Math.abs(zoom-oldZoom)>.0005)updateCameraFrustum();
    pivot.rotation.y=rotY;pivot.rotation.x=rotX;
    renderer.render(scene,camera);
  }
  animate();
}catch(err){fail(err.message||String(err));}
})();
</script>

</html>
