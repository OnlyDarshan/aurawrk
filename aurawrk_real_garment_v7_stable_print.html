const pointers=new Map();let dragging=false,lastX=0,lastY=0,pinchStart=0,pinchZoom=1;const canvas=renderer.domElement;canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture?.(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){dragging=true;lastX=e.clientX;lastY=e.clientY}else if(pointers.size===2){const a=[...pointers.values()];pinchStart=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);pinchZoom=targetZoom;dragging=false;}},{passive:false});canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;e.preventDefault();pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2){const a=[...pointers.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(pinchStart>5)targetZoom=Math.max(.68,Math.min(1.28,pinchZoom*(d/pinchStart)));return;}if(dragging){const dx=e.clientX-lastX,dy=e.clientY-lastY;targetRotY+=dx*.0105;targetRotX=Math.max(-.45,Math.min(.38,targetRotX+dy*.005));lastX=e.clientX;lastY=e.clientY;}},{passive:false});function pointerEnd(e){pointers.delete(e.pointerId);if(!pointers.size){dragging=false;pinchStart=0}else if(pointers.size===1){const p=[...pointers.values()][0];lastX=p.x;lastY=p.y;dragging=true}}canvas.addEventListener('pointerup',pointerEnd,{passive:false});canvas.addEventListener('pointercancel',pointerEnd,{passive:false});
