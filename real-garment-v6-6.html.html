<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1"/>
<title>AURAWRK — Real Garment V6.6 Chest Print</title>
<style>
:root{--bg:#09090d;--panel:#111118;--line:#292936;--text:#f7f7fa;--muted:#9b9bac;--accent:#8b5cf6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}.app{height:100%;display:flex;flex-direction:column;background:#09090d}header{height:64px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line);background:#0b0b10}.brand{font-weight:950;letter-spacing:.17em;font-size:18px}.badge{padding:8px 12px;border-radius:999px;border:1px solid #4c3a72;background:#181323;color:#ded4ff;font-size:11px;font-weight:900;letter-spacing:.04em}.viewer{position:relative;flex:1;min-height:0;overflow:hidden;background:radial-gradient(circle at 48% 42%,#2b2c32 0,#1d1e24 31%,#121319 60%,#090a0e 100%)}#stage{position:absolute;inset:0;touch-action:none;overscroll-behavior:none}#stage canvas{display:block;width:100%;height:100%;touch-action:none}.toolbar{position:absolute;z-index:10;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:6px;border:1px solid #343442;border-radius:14px;background:rgba(12,12,17,.78);backdrop-filter:blur(12px);max-width:calc(100% - 20px)}.toolbar button{appearance:none;border:1px solid #393947;background:#17171f;color:#f2f2f6;border-radius:9px;padding:9px 11px;font-size:10px;font-weight:900;letter-spacing:.035em;touch-action:manipulation;user-select:none}.toolbar button:active{transform:scale(.97);background:#211a31;border-color:#6b52a8}.swatches{position:absolute;right:14px;top:78px;z-index:10;display:flex;flex-direction:column;gap:8px;padding:8px;border:1px solid #343442;border-radius:14px;background:rgba(12,12,17,.74);backdrop-filter:blur(10px)}.swatch{width:27px;height:27px;border-radius:8px;border:2px solid rgba(255,255,255,.18);padding:0;touch-action:manipulation}.swatch.active{outline:2px solid #8b5cf6;outline-offset:2px}.designPanel{position:absolute;z-index:11;left:14px;top:78px;width:190px;padding:10px;border:1px solid #343442;border-radius:14px;background:rgba(12,12,17,.82);backdrop-filter:blur(12px)}.upload{display:block;text-align:center;padding:10px 8px;border:1px solid #5a428b;border-radius:10px;background:#1c152a;color:#eee8ff;font-size:10px;font-weight:900;letter-spacing:.04em;cursor:pointer}.upload input{display:none}.control{margin-top:9px}.control label{display:flex;justify-content:space-between;font-size:9px;font-weight:800;color:#bdbdca;margin-bottom:4px}.control input[type=range]{width:100%;accent-color:#8b5cf6}.row{display:flex;gap:6px;margin-top:9px}.row button{flex:1;border:1px solid #393947;border-radius:9px;background:#17171f;color:#eee;padding:8px 6px;font-size:9px;font-weight:900}.info{position:absolute;z-index:10;left:14px;right:14px;bottom:max(14px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:flex-end;gap:10px;pointer-events:none}.card{pointer-events:auto;border:1px solid #343442;border-radius:15px;background:rgba(14,14,20,.84);backdrop-filter:blur(12px);padding:11px 13px}.status{font-size:11px;line-height:1.45;color:#c9c9d3;max-width:340px}.hint{font-size:11px;color:#bdbdcc;white-space:nowrap}.loader{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(8,8,12,.22);pointer-events:none}.loaderBox{min-width:220px;text-align:center;padding:18px 20px;border:1px solid #353542;border-radius:16px;background:rgba(12,12,17,.92);backdrop-filter:blur(12px)}.spin{width:30px;height:30px;margin:0 auto 11px;border-radius:50%;border:3px solid #2d2d38;border-top-color:var(--accent);animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}.loader strong{display:block;font-size:12px;letter-spacing:.08em}.loader small{display:block;margin-top:6px;color:var(--muted);font-size:10px;line-height:1.4}.error{border-color:#663345;background:rgba(30,13,19,.95);color:#ffdce2}
@media(max-width:520px){header{height:58px}.brand{font-size:16px}.badge{font-size:10px;padding:7px 10px}.toolbar{top:8px;width:calc(100% - 18px);justify-content:center;gap:4px}.toolbar button{padding:8px 8px;font-size:8px}.swatches{top:63px;right:8px}.swatch{width:24px;height:24px}.designPanel{left:8px;top:63px;width:150px;padding:8px}.upload{padding:8px 5px;font-size:9px}.control{margin-top:6px}.control label{font-size:8px}.row button{padding:7px 4px;font-size:8px}.info{left:9px;right:9px;flex-direction:column;align-items:stretch}.card{width:100%}.hint{white-space:normal;text-align:center}.status{text-align:left;max-width:none}}
</style>
</head>
<body>
<div class="app"><header><div class="brand">AURAWRK</div><div class="badge">REAL GARMENT V6.6</div></header><section class="viewer">
<div id="stage"></div>
<div class="toolbar"><button id="front">FRONT</button><button id="threeq">3/4</button><button id="left">LEFT</button><button id="right">RIGHT</button><button id="back">BACK</button><button id="reset">RESET</button></div>
<div class="designPanel">
<label class="upload">UPLOAD DESIGN<input id="designInput" type="file" accept="image/png,image/jpeg,image/webp"/></label>
<div class="control"><label><span>SIZE</span><span id="sizeVal">100%</span></label><input id="designSize" type="range" min="45" max="180" value="100"/></div>
<div class="control"><label><span>X</span><span id="xVal">0</span></label><input id="designX" type="range" min="-70" max="70" value="0"/></div>
<div class="control"><label><span>Y</span><span id="yVal">0</span></label><input id="designY" type="range" min="-70" max="70" value="0"/></div>
<div class="control"><label><span>ROTATE</span><span id="rotVal">0°</span></label><input id="designRot" type="range" min="-45" max="45" value="0"/></div>
<div class="control"><label><span>PRINT</span><span id="opacityVal">92%</span></label><input id="designOpacity" type="range" min="25" max="100" value="92"/></div>
<div class="row"><button id="clearDesign">CLEAR</button><button id="centerDesign">CENTER</button></div>
</div>
<div class="swatches" aria-label="Garment colors">
<button class="swatch" data-color="#e9e6dd" style="background:#e9e6dd"></button><button class="swatch active" data-color="#090a0c" style="background:#101012"></button><button class="swatch" data-color="#343437" style="background:#343437"></button><button class="swatch" data-color="#18233b" style="background:#18233b"></button><button class="swatch" data-color="#b7a98c" style="background:#b7a98c"></button>
</div>
<div class="loader" id="loader"><div class="loaderBox" id="loaderBox"><div class="spin"></div><strong>LOADING REAL GARMENT</strong><small>Stable renderer + garment-space chest print</small></div></div>
<div class="info"><div class="card status" id="status">Loading real 3D shirt…</div><div class="card hint">Drag to rotate · pinch to zoom</div></div>
</section></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
(function(){'use strict';
const stage=document.getElementById('stage'),status=document.getElementById('status'),loader=document.getElementById('loader'),loaderBox=document.getElementById('loaderBox');
const swatches=[...document.querySelectorAll('.swatch')];
function fail(msg){status.textContent='MODEL ERROR — '+msg;loaderBox.classList.add('error');loaderBox.innerHTML='<strong>MODEL DID NOT LOAD</strong><small>'+msg+'</small>';}
if(!window.THREE||!THREE.GLTFLoader){fail('Three.js or GLTFLoader did not load.');return;}
try{
const scene=new THREE.Scene();
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.0;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.domElement.style.touchAction='none';stage.appendChild(renderer.domElement);
const camera=new THREE.OrthographicCamera(-2,2,2,-2,.01,100);camera.position.set(0,0,8);
scene.add(new THREE.HemisphereLight(0xffffff,0x08090c,.62));
const key=new THREE.DirectionalLight(0xffffff,2.55);key.position.set(-4.5,5.5,6.5);key.castShadow=true;scene.add(key);
const fill=new THREE.DirectionalLight(0xffffff,.42);fill.position.set(4.5,1.5,5);scene.add(fill);
const rim=new THREE.DirectionalLight(0xffffff,1.35);rim.position.set(3.5,4.2,-5.5);scene.add(rim);
const leftRim=new THREE.DirectionalLight(0xd9deff,.48);leftRim.position.set(-4,2,-4);scene.add(leftRim);
const pivot=new THREE.Group();scene.add(pivot);
let garment=null,garmentMaterials=[],printMaterial=null,printUniforms=null,designTexture=null;
let garmentBounds={minX:-1,maxX:1,minY:-2,maxY:2,minZ:-1,maxZ:1,w:2,h:4,d:2};
let designAspect=1;
const garmentSpaceMatrix=new THREE.Matrix4();
let baseHalfHeight=2.65,zoom=1,targetZoom=.84,rotY=-.34,targetRotY=-.34,rotX=-.055,targetRotX=-.055;
let currentGarmentColor='#090a0c';
let printBounds={cx:0,cy:0,w:1.5,h:1.8};

function setGarmentColor(hex){
  currentGarmentColor=hex;const c=new THREE.Color(hex);
  garmentMaterials.forEach(m=>{m.color.copy(c);m.roughness=.84;m.metalness=0;m.envMapIntensity=.28;m.needsUpdate=true;});
  status.textContent='FABRIC COLOR APPLIED — '+hex.toUpperCase();
}

function addSurfacePrintShader(material){
  printUniforms={
    uDesign:{value:null},uHasDesign:{value:0},uOpacity:{value:.96},uSize:{value:1},uOffset:{value:new THREE.Vector2(0,0)},uRotation:{value:0},
    uCenter:{value:new THREE.Vector2(0,0)},uArea:{value:new THREE.Vector2(1,1)},uWorldToGarment:{value:new THREE.Matrix4()},uImageAspect:{value:1}
  };
  material.onBeforeCompile=shader=>{
    Object.assign(shader.uniforms,printUniforms);
    shader.vertexShader=shader.vertexShader
      .replace('#include <common>','#include <common>\nvarying vec3 vPrintGarmentPos;\nvarying vec3 vPrintGarmentNormal;\nuniform mat4 uWorldToGarment;')
      .replace('#include <begin_vertex>','#include <begin_vertex>\nvec4 _aurawrkWorldPos = modelMatrix * vec4(position,1.0);\nvPrintGarmentPos = (uWorldToGarment * _aurawrkWorldPos).xyz;')
      .replace('#include <beginnormal_vertex>','#include <beginnormal_vertex>\nvec3 _aurawrkWorldNormal = normalize(mat3(modelMatrix) * normal);\nvPrintGarmentNormal = normalize(mat3(uWorldToGarment) * _aurawrkWorldNormal);');
    shader.fragmentShader=shader.fragmentShader
      .replace('#include <common>','#include <common>\nvarying vec3 vPrintGarmentPos;\nvarying vec3 vPrintGarmentNormal;\nuniform sampler2D uDesign;\nuniform float uHasDesign;\nuniform float uOpacity;\nuniform float uSize;\nuniform vec2 uOffset;\nuniform float uRotation;\nuniform vec2 uCenter;\nuniform vec2 uArea;\nuniform float uImageAspect;')
      .replace('#include <map_fragment>',`#include <map_fragment>
if (uHasDesign > 0.5) {
  vec2 p = (vPrintGarmentPos.xy - uCenter) / max(uArea, vec2(0.0001));
  p -= uOffset;
  float cs = cos(uRotation), sn = sin(uRotation);
  p = mat2(cs,-sn,sn,cs) * p;
  p /= max(uSize,0.001);
  vec2 uvp = p + 0.5;
  float edge = 0.006;
  float inside = smoothstep(0.0,edge,uvp.x)*smoothstep(0.0,edge,uvp.y)*smoothstep(0.0,edge,1.0-uvp.x)*smoothstep(0.0,edge,1.0-uvp.y);
  float frontMask = smoothstep(0.18,0.58, normalize(vPrintGarmentNormal).z);
  if (inside > 0.001 && frontMask > 0.001) {
    vec4 ink = texture2D(uDesign, vec2(uvp.x,1.0-uvp.y));
    float a = ink.a * uOpacity * inside * frontMask;
    diffuseColor.rgb = mix(diffuseColor.rgb, ink.rgb, a);
  }
}`);
    material.userData.shader=shader;
  };
  material.customProgramCacheKey=()=> 'aurawrk-garment-space-print-v66';
  material.needsUpdate=true;
}
function prepareGarment(obj){
  garmentMaterials=[];let largestMesh=null,largestVol=-1;
  obj.traverse(o=>{if(!o.isMesh)return;
    o.castShadow=true;o.receiveShadow=true;
    if(!o.geometry.boundingBox)o.geometry.computeBoundingBox();
    const bb=o.geometry.boundingBox,sz=bb.getSize(new THREE.Vector3()),vol=sz.x*sz.y*sz.z;
    if(vol>largestVol){largestVol=vol;largestMesh=o;}
    const source=Array.isArray(o.material)?o.material[0]:o.material;
    const m=new THREE.MeshStandardMaterial({color:0x090a0c,roughness:.84,metalness:0,side:THREE.DoubleSide});
    if(source){if(source.normalMap)m.normalMap=source.normalMap;if(source.bumpMap)m.bumpMap=source.bumpMap;if(source.roughnessMap)m.roughnessMap=source.roughnessMap;if(source.aoMap)m.aoMap=source.aoMap;}
    o.material=m;garmentMaterials.push(m);
  });
  obj.updateMatrixWorld(true);
  const box=new THREE.Box3().setFromObject(obj),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());
  obj.position.set(-center.x,-center.y,-center.z);obj.updateMatrixWorld(true);
  const uniform=4.25/Math.max(size.y,.0001);obj.scale.setScalar(uniform);obj.updateMatrixWorld(true);
  const b2=new THREE.Box3().setFromObject(obj),c2=b2.getCenter(new THREE.Vector3());obj.position.x-=c2.x;obj.position.y-=c2.y;obj.position.z-=c2.z;obj.updateMatrixWorld(true);
  const b3=new THREE.Box3().setFromObject(obj),s3=b3.getSize(new THREE.Vector3()),sphere=b3.getBoundingSphere(new THREE.Sphere());
  garmentBounds={minX:b3.min.x,maxX:b3.max.x,minY:b3.min.y,maxY:b3.max.y,minZ:b3.min.z,maxZ:b3.max.z,w:s3.x,h:s3.y,d:s3.z};
  printBounds.cx=(b3.min.x+b3.max.x)*.5;
  printBounds.cy=b3.max.y-s3.y*.43;
  printBounds.w=s3.x*.50;
  printBounds.h=s3.y*.38;
  if(largestMesh){printMaterial=largestMesh.material;addSurfacePrintShader(printMaterial);}
  baseHalfHeight=Math.max(s3.y*.66,sphere.radius*1.25);setGarmentColor(currentGarmentColor);updateCameraFrustum();updateDesign();
}
function updateCameraFrustum(){const r=stage.getBoundingClientRect(),aspect=Math.max(.25,r.width/Math.max(1,r.height)),hh=(baseHalfHeight*1.16)/zoom,hw=hh*aspect;camera.left=-hw;camera.right=hw;camera.top=hh;camera.bottom=-hh;camera.near=.01;camera.far=100;camera.updateProjectionMatrix();camera.position.set(0,0,8);camera.lookAt(0,0,0);}
function resize(){const r=stage.getBoundingClientRect();renderer.setSize(Math.max(1,r.width),Math.max(1,r.height),false);updateCameraFrustum();}addEventListener('resize',resize,{passive:true});resize();
new THREE.GLTFLoader().load('https://raw.githubusercontent.com/AvatarParzival/3d/main/Models/shirt.glb',g=>{garment=g.scene;pivot.add(garment);prepareGarment(garment);loader.remove();status.textContent='REAL GARMENT V6.6 READY — print now uses the shirt material surface, not a floating plane.';},p=>{if(p.total)status.textContent='Loading garment… '+Math.round(p.loaded/p.total*100)+'%';},e=>fail((e&&e.message)||'Could not download shirt.glb'));

function updateDesign(){
  const s=Number(document.getElementById('designSize').value)/100;
  const xv=Number(document.getElementById('designX').value),yv=Number(document.getElementById('designY').value),rv=Number(document.getElementById('designRot').value),op=Number(document.getElementById('designOpacity').value)/100;
  document.getElementById('sizeVal').textContent=Math.round(s*100)+'%';document.getElementById('xVal').textContent=xv;document.getElementById('yVal').textContent=yv;document.getElementById('rotVal').textContent=rv+'°';document.getElementById('opacityVal').textContent=Math.round(op*100)+'%';
  if(!printUniforms)return;
  printUniforms.uSize.value=s;
  printUniforms.uOffset.value.set(xv/70*.34,yv/70*.34);
  printUniforms.uRotation.value=-THREE.MathUtils.degToRad(rv);
  printUniforms.uOpacity.value=op;
  printUniforms.uCenter.value.set(printBounds.cx,printBounds.cy);
  const maxW=garmentBounds.w*.56,maxH=garmentBounds.h*.40;
  let ph=maxH,pw=ph*Math.max(.15,designAspect);
  if(pw>maxW){pw=maxW;ph=pw/Math.max(.15,designAspect);}
  printUniforms.uArea.value.set(pw,ph);
  printUniforms.uImageAspect.value=designAspect;
}
function setDesignFromFile(file){
  const reader=new FileReader();reader.onerror=()=>status.textContent='DESIGN ERROR — iPhone could not read that file.';
  reader.onload=()=>{const img=new Image();img.onerror=()=>status.textContent='DESIGN ERROR — that image format could not be decoded.';
    img.onload=()=>{if(designTexture)designTexture.dispose();designAspect=img.naturalWidth/Math.max(1,img.naturalHeight);const tex=new THREE.Texture(img);tex.needsUpdate=true;tex.encoding=THREE.sRGBEncoding;tex.minFilter=THREE.LinearMipmapLinearFilter;tex.magFilter=THREE.LinearFilter;tex.generateMipmaps=true;tex.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());tex.premultiplyAlpha=false;tex.flipY=false;designTexture=tex;
      if(printUniforms){printUniforms.uDesign.value=tex;printUniforms.uHasDesign.value=1;updateDesign();}
      status.textContent='DESIGN APPLIED — high-resolution chest mapping active. Rotate to test attachment.';
    };img.src=reader.result;};reader.readAsDataURL(file);
}
document.getElementById('designInput').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(!f)return;status.textContent='Loading design…';setDesignFromFile(f);});
['designSize','designX','designY','designRot','designOpacity'].forEach(id=>document.getElementById(id).addEventListener('input',updateDesign));
document.getElementById('clearDesign').onclick=()=>{if(printUniforms)printUniforms.uHasDesign.value=0;if(designTexture){designTexture.dispose();designTexture=null;}status.textContent='Design cleared.';};
document.getElementById('centerDesign').onclick=()=>{document.getElementById('designSize').value=100;document.getElementById('designX').value=0;document.getElementById('designY').value=0;document.getElementById('designRot').value=0;document.getElementById('designOpacity').value=92;updateDesign();};

const pointers=new Map();let dragging=false,lastX=0,lastY=0,pinchStart=0,pinchZoom=1;const canvas=renderer.domElement;
canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture?.(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){dragging=true;lastX=e.clientX;lastY=e.clientY}else if(pointers.size===2){const a=[...pointers.values()];pinchStart=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);pinchZoom=targetZoom;dragging=false;}},{passive:false});
canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;e.preventDefault();pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2){const a=[...pointers.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(pinchStart>5)targetZoom=Math.max(.68,Math.min(1.28,pinchZoom*(d/pinchStart)));return;}if(dragging){const dx=e.clientX-lastX,dy=e.clientY-lastY;targetRotY+=dx*.0105;targetRotX=Math.max(-.45,Math.min(.38,targetRotX+dy*.005));lastX=e.clientX;lastY=e.clientY;}},{passive:false});
function pointerEnd(e){pointers.delete(e.pointerId);if(!pointers.size){dragging=false;pinchStart=0}else if(pointers.size===1){const p=[...pointers.values()][0];lastX=p.x;lastY=p.y;dragging=true}}
canvas.addEventListener('pointerup',pointerEnd,{passive:false});canvas.addEventListener('pointercancel',pointerEnd,{passive:false});
document.getElementById('front').onclick=()=>{targetRotY=0;targetRotX=-.055};document.getElementById('threeq').onclick=()=>{targetRotY=-.42;targetRotX=-.055};document.getElementById('back').onclick=()=>{targetRotY=Math.PI;targetRotX=-.055};document.getElementById('left').onclick=()=>{targetRotY=-Math.PI/2;targetRotX=-.055};document.getElementById('right').onclick=()=>{targetRotY=Math.PI/2;targetRotX=-.055};document.getElementById('reset').onclick=()=>{targetRotY=-.34;targetRotX=-.055;targetZoom=.84};
swatches.forEach(btn=>btn.onclick=()=>{swatches.forEach(b=>b.classList.remove('active'));btn.classList.add('active');setGarmentColor(btn.dataset.color)});
function animate(){requestAnimationFrame(animate);rotY+=(targetRotY-rotY)*.14;rotX+=(targetRotX-rotX)*.14;const old=zoom;zoom+=(targetZoom-zoom)*.14;if(Math.abs(zoom-old)>.0005)updateCameraFrustum();pivot.rotation.y=rotY;pivot.rotation.x=rotX;pivot.updateMatrixWorld(true);garmentSpaceMatrix.copy(pivot.matrixWorld).invert();if(printUniforms)printUniforms.uWorldToGarment.value.copy(garmentSpaceMatrix);renderer.render(scene,camera)}animate();
}catch(err){fail(err.message||String(err))}
})();
</script>
</body></html>
